name: Compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    name: Pruebas del motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # El motor es Kotlin puro: se prueba sin SDK de Android y falla rápido.
      - run: ./gradlew :engine:test

  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    needs: motor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:assembleDebug --stacktrace

      # El APK de depuración va firmado con la clave de depuración, así que se
      # instala directamente en el móvil sin más trámite.
      - uses: actions/upload-artifact@v4
        with:
          name: vocabulario-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
